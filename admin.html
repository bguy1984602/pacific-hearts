<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pacific Hearts Administration</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#fff8fb;color:#35253a}header{padding:22px;background:linear-gradient(110deg,#51214c,#ac2d69);color:white}header h1{font:italic 32px Georgia;margin:0}header a{color:white}main{max-width:900px;margin:auto;padding:16px}.panel{padding:20px;background:white;border:1px solid #ead4e2;border-radius:15px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff1f7;padding:14px;border-radius:12px}.stat b{display:block;font-size:27px}button{background:#a60e59;color:white;border:0;border-radius:8px;padding:12px;font:inherit;cursor:pointer}button:disabled{opacity:.5}select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #d4c1ce;border-radius:8px;margin:6px 0}textarea{min-height:65px}.case{border-top:1px solid #eee;padding:15px 0}.muted{color:#6d606b}[hidden]{display:none!important}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><header><h1>♡ Pacific Hearts</h1><p>Private administration · <a href="index.html">Homepage</a></p></header><main><section class="panel"><h2>Administration</h2><p id="status" role="status">Checking access…</p><button id="refresh">Refresh</button></section><div id="dashboard" hidden><div class="stats"><div class="stat">Profiles<b id="profiles"></b></div><div class="stat">Messages<b id="messages"></b></div><div class="stat">Open cases<b id="open_cases"></b></div></div><section class="panel"><h2>Moderation queue</h2><p class="muted">Review reports and record decisions. Saving a decision does not automatically delete content or suspend a member.</p><div id="cases"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),client=supabase.createClient('https://oydhphpbcsiedfkkwujq.supabase.co','sb_publishable_HjB_yE3s66LO8FsS4n2iGw_Jh73wk-m');function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}async function load(){ $('dashboard').hidden=true;$('status').textContent='Checking access…';try{const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user){$('status').replaceChildren(node('span','Sign in first: '));const a=node('a','Member sign in');a.href='register.html?mode=signin';$('status').append(a);return}const {data,error}=await client.rpc('ph_admin_dashboard');if(error){$('status').textContent=error.code==='42501'?'This account does not have administrator access.':error.message;return}for(const key of ['profiles','messages','open_cases'])$(key).textContent=data[key];const list=$('cases');list.replaceChildren();if(!data.cases.length)list.append(node('p','No moderation cases.'));for(const c of data.cases){const box=node('section');box.className='case';box.append(node('h3','Case #'+c.id+' — '+c.source),node('p','Reason: '+c.reason+' · '+new Date(c.created_at).toLocaleString()));const choice=node('select');choice.setAttribute('aria-label','Case status');for(const s of ['open','reviewing','resolved','dismissed']){const opt=node('option',s);opt.value=s;opt.selected=c.status===s;choice.append(opt)}const notes=node('textarea');notes.value=c.notes||'';notes.maxLength=2000;notes.setAttribute('aria-label','Private case notes');const save=node('button','Save decision'),msg=node('p');msg.setAttribute('role','status');save.onclick=async()=>{save.disabled=true;const {error}=await client.rpc('ph_admin_review_case',{p_case_id:c.id,p_status:choice.value,p_notes:notes.value});msg.textContent=error?error.message:'Saved.';save.disabled=false;if(!error)await load()};box.append(choice,notes,save,msg);list.append(box)}$('dashboard').hidden=false;$('status').textContent='Administrator access verified.'}catch(e){$('status').textContent=e.message||'Connection error'}}$('refresh').onclick=load;load()})();
</script></body></html>
