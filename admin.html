<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pacific Hearts Administration</title>
  <link rel="stylesheet" href="admin.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <header class="site-header">
    <div><strong>♡ Pacific Hearts</strong><a href="index.html">Homepage</a></div>
  </header>
  <main>
    <div class="page-heading">
      <h1>Administration</h1>
      <button id="refresh" type="button" class="secondary">Refresh</button>
    </div>
    <p id="access-status" role="status">Checking access…</p>
    <a href="register.html?mode=signin" id="sign-in" hidden>Sign in to Pacific Hearts</a>
    <div id="dashboard" hidden>
      <dl class="stats">
        <div><dt>Profiles</dt><dd id="profiles"></dd></div>
        <div><dt>Messages</dt><dd id="messages"></dd></div>
        <div><dt>Open cases</dt><dd id="open_cases"></dd></div>
      </dl>
      <nav aria-label="Administration sections">
        <button id="members-tab" type="button" aria-pressed="true">Members</button>
        <button id="reports-tab" type="button" aria-pressed="false">Reports</button>
      </nav>
      <section class="panel" id="members-panel" aria-labelledby="members-title">
        <h2 id="members-title">Members</h2>
        <form id="member-search" class="filters">
          <label>Search members
            <input id="search-term" type="search" maxlength="150" placeholder="Name, email, or member ID">
          </label>
          <label>Account status
            <select id="member-filter">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="suspended">Suspended</option>
              <option value="banned">Banned</option>
            </select>
          </label>
          <button type="submit">Search</button>
        </form>
        <p id="member-status" role="status"></p>
        <ul id="member-list" class="member-list"></ul>
        <button id="more-members" class="secondary" type="button" hidden>Show more members</button>
      </section>
      <section class="panel" id="reports-panel" aria-labelledby="reports-title" hidden>
        <h2 id="reports-title">Moderation reports</h2>
        <label>Report status
          <select id="case-filter">
            <option value="all">All statuses</option>
            <option value="open">Open</option>
            <option value="reviewing">Reviewing</option>
            <option value="resolved">Resolved</option>
            <option value="dismissed">Dismissed</option>
          </select>
        </label>
        <p id="case-status" role="status"></p>
        <div id="case-list"></div>
        <button id="more-cases" class="secondary" type="button" hidden>Show more reports</button>
      </section>
    </div>
  </main>
  <dialog id="member-dialog" aria-labelledby="detail-title">
    <div class="dialog-heading">
      <h2 id="detail-title">Member details</h2>
      <form method="dialog"><button type="submit" class="secondary" autofocus>Close</button></form>
    </div>
    <p id="detail-status" role="status"></p>
    <div id="member-detail"></div>
  </dialog>
</body>
</html>
